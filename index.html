<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Login</title>
    <!-- Using Poppins is excellent, but let's ensure the weight matches -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- We will use a custom CSS approach for the logo to be precise -->
    <style>
        /* --- 🎨 GLOBAL STYLES & RESET --- */
        body {
            font-family: 'Poppins', sans-serif;
            background: #f9f9f9; /* Very light off-white background, matching their current look */
            display: flex;
            justify-content: center; 
            align-items: center;     
            min-height: 100vh;       
            margin: 0;
        }

        /* --- 👻 SNAPCHAT CONTAINER STYLES (The Card) --- */
        .login-container {
            background-color: white;
            width: 92%; /* Slightly wider to feel more substantial */
            max-width: 375px; /* Tighter constraint for mobile feel */
            padding: 40px 35px; /* More padding inside */
            border-radius: 30px; /* Increased radius slightly, very key! */
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); /* Soft shadow - slightly lifted */
            text-align: center;
        }

        /* --- 🟡 LOGO AREA (The Ghost) --- */
        .snapchat-logo {
            font-size: 75px; /* Slightly smaller text size */
            color: #FFFC00; /* Official Snapchat Yellow */
            line-height: 1;
            margin-bottom: 20px; /* Tighter spacing to the title */
        }

        /* --- TEXT & HEADINGS --- */
        .title {
            font-size: 36px; /* Bigger and bolder */
            color: #262626;
            margin-bottom: 4px; /* Very tight gap below title */
            font-weight: 800; /* Use extra bold weight for the main name */
        }

        .subtitle {
            font-size: 15px; /* Slightly smaller subtitle text */
            color: #8e8e93;
            margin-bottom: 30px;
        }

        /* --- 📝 INPUT FIELDS --- */
        .input-group {
            margin-bottom: 22px; /* Tighter spacing between fields */
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px; /* Smaller font size for labels */
            color: #6a6a70; /* Slightly darker grey for better contrast */
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-field {
            width: 100%;
            padding: 14px 20px; /* Padding adjusted slightly */
            border: 1px solid #d1d1d5; /* Very light, specific border color */
            border-radius: 12px; /* Slightly less rounded than the container, matching modern UI */
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-field:focus {
            border-color: #FFFC00;
            outline: none;
            /* The shadow on focus is crucial for the authentic look */
            box-shadow: 0 0 0 3px rgba(255, 252, 0, 0.15); /* Subtle yellow glow */
        }

        /* --- 🔘 BUTTON STYLES (The main action) --- */
        #loginButton {
            width: 100%;
            padding: 16px;
            background-color: #FFFC00;
            border: none;
            border-radius: 30px; /* Perfect pill shape */
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            color: #262626;
            transition: background-color 0.15s, transform 0.1s; /* Faster transition */
        }

        #loginButton:hover {
            background-color: #fcdb00;
        }
        #loginButton:active {
            transform: scale(0.98);
        }

        /* --- 📢 STATUS MESSAGE (The feedback area) --- */
        #statusMessage {
            margin-top: 25px;
            padding: 10px;
            border-radius: 10px;
            font-size: 14.5px; /* Smaller font size for the message itself */
            min-height: 30px;
        }

        #statusMessage strong {
            margin-right: 6px;
            font-weight: 700;
        }
        .success-text { color: #2ecc71; } /* Emerald Green */
        .error-text { color: #e74c3c; }   /* Bright Red */
    </style>
</head>
<body>

    <div class="login-container">
        <!-- 👻 The Ghost Logo -->
        <div class="snapchat-logo">👻</div> 
        
        <h1 class="title">Snapchat</h1>
        <p class="subtitle">Log in to see your snaps!</p>

        <!-- Input Field for Username -->
        <div class="input-group">
            <label for="usernameInput">Username or Email</label>
            <input type="text" id="usernameInput" class="input-field" placeholder="Enter your snap handle..." required>
        </div>

        <!-- Submission Button -->
        <button id="loginButton">Log In</button>

        <!-- Status Message Area -->
        <div id="statusMessage">
            <!-- Initial status message will load here -->
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const usernameInput = document.getElementById('usernameInput');
            const loginButton = document.getElementById('loginButton');
            const statusMessageDiv = document.getElementById('statusMessage');

            /**
             * Updates the visible text on the page with styling.
             */
            function logToStatusElement(message, type = 'info') {
                let messageHTML = `<strong style="font-weight: 700;">STATUS:</strong> ${message}`;
                statusMessageDiv.innerHTML = messageHTML;

                // Resetting and applying color classes for clean styling
                statusMessageDiv.className = ''; 
                
                if (type === 'success') {
                    statusMessageDiv.classList.add('success-text');
                } else if (type === 'error') {
                    statusMessageDiv.classList.add('error-text');
                } else { // default/info
                     // Default styling is applied by the CSS block above, but good practice to define it here too
                     statusMessageDiv.classList.add('info-text'); 
                }
            }

             * Handles the click event on the Login button.
