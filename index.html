<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL: This viewport tag tells mobile browsers (like Safari) how to render the page -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persistent Console Logging Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 30px; 
            max-width: 600px; /* Keeps it tidy on large screens */
            margin: 0 auto; /* Centers the content */
        }
        #statusMessage { 
            margin-bottom: 25px; 
            padding: 18px; 
            border: 2px solid #007bff; /* A nice blue border */
            background-color: #e9f4ff; /* Very light blue background */
            border-radius: 8px;
        }
        input[type="text"] {
            padding: 10px;
            width: calc(70% - 22px); /* Adjusts width based on padding/margin */
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>📱 Mobile Safari Log Test</h1>
    <p id="statusMessage">Initializing... Please watch the Console (F12)!</p>

    <!-- The input field where the iPhone user will type their login -->
    <label for="usernameInput" style="display: block; margin-bottom: 8px;">Enter Username (On your iPhone Safari):</label>
    <div style="display: flex;">
        <input type="text" id="usernameInput" placeholder="e.g., JaneDoeMobile">
        <button onclick="captureAndLogLogin()">Submit Login & Log</button>
    </div>

    <!-- The JavaScript logic that controls the logging -->
    <script>
        // =============================================================
        // ⭐ CORE FIX: Clear the console immediately upon script execution.
        // This is what prevents old logs from sticking around after a refresh!
        console.clear(); 
        // =============================================================


        /**
         * Runs once the page first loads (This executes whether loaded via PC or Mobile).
         */
        window.onload = function() {
            // Use different logging levels to show variety in Chrome Console
            console.log("========================================="); // Separator 1
            console.log("✅ [INIT SUCCESS] Page loaded successfully across all browsers.");
            console.warn("⚠️ [SETUP WARNING] Console has been cleared! New logs will persist.");
            console.info("💡 [READY STATE] Waiting for user input from mobile device...");

            // Update the visible status message on the screen
            logToStatusElement("Page loaded and ready to receive your iPhone login!");
        };


        /**
         * Handles the button click event, capturing data and logging it robustly.
         */
        function captureAndLogLogin() {
            const inputField = document.getElementById('usernameInput');
            const username = inputField.value.trim();

            if (username) {
                // --------------------- LOGGING SEQUENCE STARTS HERE ---------------------

                // 1. Visual Separator in Console (Makes it easy to spot new entries)
                console.log("-----------------------------------------"); 
                
                // 2. Primary Log: The actual event that occurred (use 'log' for standard info)
                console.log(`👤 [USER LOGIN CAPTURED] User entered: "${username}"`); 
                
                // 3. Confirmation Log: A quick success message (using 'info')
                console.info(`✅ [ACTION CONFIRMED] Login captured successfully.`); 

                // 4. Final Status Update (Optional but helpful)
                logToStatusElement(`Success! User '${username}' has been logged. Check the console above!`);
            } else {
                // Error state: Use 'error' so Chrome highlights it red in the console
                console.error("❌ [INPUT ERROR] Cannot submit login: The field is empty."); 
                logToStatusElement("🔴 Submission Failed: Please enter a username before submitting.");
            }
        }

        /**
         * Helper function to update the visible text on the body of the page.
         */
        function logToStatusElement(message) {
            const status = document.getElementById('statusMessage');
            // We use innerHTML here so we can render <strong> tags inside the message
            status.innerHTML = `<strong>STATUS:</strong> ${message}`;
        }

    </script>

</body>
</html>
